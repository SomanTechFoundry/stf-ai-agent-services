name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run type-check
        continue-on-error: true

      - run: npm test

      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
          API_SECRET_KEY: ci-test-secret-key-for-build-only
          GEMINI_API_KEY: placeholder-for-build
